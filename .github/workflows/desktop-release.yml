name: desktop-release
run-name: "desktop ${{ inputs.version || github.ref_name }}"

# Builds the desktop app for this fork and publishes it as a GitHub Release.
# electron-updater in the installed app reads latest.yml (Windows) / latest-linux.yml (AppImage) from
# the release assets, so those manifests are what turn a merge into an in-app update. The .deb and .rpm
# are plain downloads — electron-updater cannot self-update those, the system package manager owns them.
#
# Trigger by pushing a tag (`git tag v1.18.18 && git push --no-verify origin v1.18.18`) or from the
# Actions tab. The upstream publish.yml is guarded to anomalyco/opencode and skips on forks.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.18.18"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  # Resolving the version and creating the release once, up front, keeps the matrix jobs from racing
  # each other to create the same tag's release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Expected a semver version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  build:
    needs: prepare
    strategy:
      # One platform failing should not cancel the other's build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: "--win"
            # latest.yml is the Windows updater manifest; the blockmap lets it fetch only changed chunks.
            artifacts: "opencode-desktop-win-*.exe opencode-desktop-win-*.exe.blockmap latest.yml"
          - os: ubuntu-latest
            platform: "--linux"
            # Deliberately broad: electron-builder does not always apply artifactName to deb/rpm, whose
            # fpm-driven names differ from the AppImage. dist/ holds only this build's output.
            artifacts: "*.AppImage *.AppImage.blockmap *.deb *.rpm latest-linux.yml"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # electron-builder shells out to `rpm` to build the .rpm; it is not on the runner by default.
      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Native install scripts (tree-sitter-powershell) are not needed to package the desktop app,
      # and they fail on some runner images. electron-builder downloads Electron itself.
      # Retried because applying a patchfile races itself on Windows and fails with
      # "renaming changes to cache dir: ENOTEMPTY" (oven-sh/bun#28147). The collision is a half-written
      # entry in bun's cache, so the cache is cleared before each retry rather than just re-running.
      # --linker hoisted is the same workaround the repo's own setup-bun action applies on Windows.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install --linker hoisted --ignore-scripts; then exit 0; fi
            echo "::warning::bun install failed (attempt ${attempt}); clearing cache and retrying"
            rm -rf "$(bun pm cache)" || true
            sleep 5
          done
          echo "::error::bun install failed after 3 attempts"
          exit 1

      # electron-builder reads the version from packages/desktop/package.json and writes it into the
      # updater manifests, which is what the installed app compares against. Drive it from the tag so
      # the release and the manifests can never disagree.
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun --eval '
            const path = "packages/desktop/package.json"
            const pkg = await Bun.file(path).json()
            pkg.version = process.env.VERSION
            await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n")
          '

      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      # --publish never is required: the `publish` block in electron-builder.config.ts makes
      # electron-builder upload to GitHub itself as soon as it detects CI and a tag, which needs its own
      # token and would race the upload step below. Build the artifacts only.
      - name: Package
        working-directory: packages/desktop
        run: bunx electron-builder ${{ matrix.platform }} --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: prod

      # --clobber so re-running a tag replaces assets instead of failing on duplicates.
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd packages/desktop/dist
          shopt -s nullglob
          files=(${{ matrix.artifacts }})
          if (( ${#files[@]} == 0 )); then
            echo "::error::No artifacts matched for ${{ matrix.os }}"
            ls -la
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
